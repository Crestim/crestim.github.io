<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crestim</title>
<meta name="description" content="Crestim makes small, private mobile apps.">
<link rel="icon" href="aid/icon.png">
<style>
  :root { --bg: #ffffff; --text: #1c1c1e; --muted: #5b5f6b; --card: #f3f4f8; --link: #5b3fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #05060d; --text: #eef0f8; --muted: #a4a9bb; --card: #12141f; --link: #8fd8ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; line-height: 1.55; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 2rem; }
  .muted { color: var(--muted); margin: 0; }
  a.app { display: flex; gap: 16px; align-items: center; margin-top: 32px; padding: 16px; border-radius: 16px; background: var(--card); color: inherit; text-decoration: none; }
  a.app img { width: 64px; height: 64px; border-radius: 15px; }
  a.app strong { display: block; font-size: 1.1rem; }
  a { color: var(--link); }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Crestim</h1>
  <p class="muted">Small, private mobile apps.</p>

  <a class="app" href="aid/">
    <img src="aid/icon.png" alt="">
    <span><strong>AID: AI Detector</strong><span class="muted">Spot deepfakes and AI-generated images and videos, on your device.</span></span>
  </a>

  <footer>
    <p>Contact: <a href="mailto:crestimsupport@gmail.com">crestimsupport@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
